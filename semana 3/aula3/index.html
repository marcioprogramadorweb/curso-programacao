<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Semana 3 - Aula 3</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="container">
            <h1>Painel de cards interativos</h1>

            <p>
                Use os botões para destacar cards individualmente ou todos de uma vez.
            </p>

            <div class="cards">
                <section class="card">
                    <h2>Card 1</h2>
                    <p>Este é o primeiro card.</p>
                    <button class="botao-destacar">Destacar este card</button>
                </section>
                <section class="card">
                    <h2>Card 2</h2>
                    <p>Este é o segundo card.</p>
                    <button class="botao-destacar">Destacar este card</button>
                </section>
                <section class="card">
                    <h2>Card 3</h2>
                    <p>Este é o terceiro card.</p>
                    <button class="botao-destacar">Destacar este card</button>
                </section>
                <section class="card">
                    <h2>Card 4</h2>
                    <p>Este é o quarto card.</p>
                    <button class="botao-destacar">Destacar este card</button>
                </section>
            </div>

            <button id="botaoDestacarTodos">Destacar todos os cards</button>
            <button id="botaoLimparTodos">Remover destaques</button>
            <button id="botaoAlternarTodos">Alternar todos</button>
        </main>

        <script src="script.js"></script>
    </body>
</html>
