<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 3 - Aula 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 id="titulo">Introdução ao DOM</h1>

    <p id="descricao">
      Clique nos botões abaixo para alterar os elementos da página.
    </p>

    <div class="botoes">
      <button id="botaoTitulo">Mudar título da página</button>
      <button id="botaoDescricao">Alterar descrição</button>
      <button id="botaoDestaque">Adicionar destaque</button>
      <button id="botaoLimpar">Limpar destaque</button>
      <button id="botaoCaixa">Alterar texto da caixa</button>
      <button id="botaoAlternar">Alternar destaque</button>
    </div>

    <div id="caixa" class="caixa">
      Esta é uma caixa que será manipulada pelo JavaScript.
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
