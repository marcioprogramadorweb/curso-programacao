<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 3 - Aula 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="titulo-principal">Painel de acompanhamento</h1>

    <p class="descricao">
      Clique em uma opção para atualizar o cartão de status.
    </p>

    <section class="card">
      <h2 class="card-titulo">Status atual</h2>
      <p class="card-texto">Aguardando ação do usuário.</p>
    </section>

    <div class="botoes">
      <button class="botao-sucesso">Marcar como sucesso</button>
      <button class="botao-alerta">Marcar como alerta</button>
      <button class="botao-erro">Marcar como erro</button>
      <button class="botao-limpar">Limpar status</button>
      <button class="botao-andamento">Marcar como em andamento</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
