<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 2 - Aula 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Cadastro simples</h1>

    <p>
      Digite seu nome para gerar uma mensagem personalizada.
    </p>

    <label for="nomeUsuario">Nome:</label>
    <input type="text" id="nomeUsuario" placeholder="Digite seu nome">

    <label for="idadeUsuario">Idade:</label>
    <input type="number" id="idadeUsuario" placeholder="Digite sua idade">

    <button id="botaoEnviar">Gerar mensagem</button>

    <p id="resultado"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
