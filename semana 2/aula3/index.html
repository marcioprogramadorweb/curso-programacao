<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 2 - Aula 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Controle de Ganhos do Dia</h1>

    <p>
      Informe seus ganhos e gastos para calcular a sobra do dia.
    </p>

    <label for="faturamento">Faturamento:</label>
    <input type="number" id="faturamento" placeholder="Ex: 350">

    <label for="combustivel">Combustível:</label>
    <input type="number" id="combustivel" placeholder="Ex: 100">

    <label for="almoco">Almoço:</label>
    <input type="number" id="almoco" placeholder="Ex: 25">

    <label for="manutencao">Manutenção:</label>
    <input type="number" id="manutencao" placeholder="Ex: 15">

    <label for="horasTrabalhadas">Horas trabalhadas:</label>
    <input type="number" id="horasTrabalhadas" placeholder="Ex: 10">

    <button id="botaoCalcular">Calcular</button>

    <div id="resultado"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
